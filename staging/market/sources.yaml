# Catálogo de fuentes externas — staging
# Actualizar status: probing | validated | promoted | rejected

sources:
  latam_tools:
    name: LATAM Tools Market API
    base_url: https://mercado.latam-tools.com.br/api/v1
    auth: none
    batch_size: 100
    fetch_command: python staging/market/fetch_batch.py latam --resume

  ragnapi:
    name: RagnaAPI (iRO Wiki data)
    base_url: https://ragnapi.com/api/v1/re-newal
    auth: none
    batch_size: 1
    fetch_command: python staging/market/fetch_batch.py ragnapi --resume
    provides: [item_metadata, monster_stats, drop_tables]
    status: probing
    promoted: false
    bulk_dir: staging/market/ragnapi/bulk/items

  divine_pride:
    name: Divine Pride Database API
    base_url: https://www.divine-pride.net/api/database
    auth: api_key_env DIVINE_PRIDE_API_KEY
    batch_size: 1
    fetch_command: python staging/market/fetch_batch.py divine_pride --resume

  atlantis_playro:
    name: Atlantis Play-RO price history
    base_url: http://atlantis.play-ro.com/index.php
    auth: none
    method: html_scrape_post
    batch_size: 1
    fetch_command: python staging/market/fetch_batch.py atlantis --resume

  vendings_local:
    name: Dump MySQL vendings OzRo
    status: blocked
    note: Esperar hasta tener tienda autotrade activa
